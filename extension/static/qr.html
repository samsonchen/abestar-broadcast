<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Join the live translation</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #fff;
        color: #111;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2vh;
      }
      h1 {
        margin: 0;
        font-size: 5vh;
      }
      canvas {
        width: min(70vh, 90vw) !important;
        height: auto !important;
      }
      .pin {
        font-size: 7vh;
        font-weight: 700;
        letter-spacing: 0.15em;
      }
      .link {
        font-size: 2.5vh;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h1>Scan for the live translation</h1>
    <canvas id="qr"></canvas>
    <div>PIN <span id="pin" class="pin"></span></div>
    <div id="link" class="link"></div>
    <script src="qr.js"></script>
  </body>
</html>
