<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Abestar Live</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .toolbar input {
        flex: 1 1 240px;
      }
      .relative {
        position: relative;
      }
      .absolute {
        position: absolute;
        bottom: 16px;
        left: 50%;
      }
      [data-testid='subtitle-feed'] {
        max-height: 70vh;
        overflow-y: auto;
      }
      .rounded-card {
        border-radius: 8px;
        padding: 8px 16px;
        margin-bottom: 8px;
        background: #f8fafc;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.15);
      }
      .italic {
        font-style: italic;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="play">Play the recorded session</button>
      <input id="text" placeholder="Text of the next line" />
      <button id="say">Say a line</button>
      <button id="stuck">Say a line that stays a draft</button>
      <button id="forget">Forget lines on reload</button>
    </div>
    <main id="app"></main>
    <script type="module" src="./mock-page.ts"></script>
  </body>
</html>
