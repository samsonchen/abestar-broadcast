name: Pages

# Publishes the viewer to https://samsonchen.github.io/abestar-broadcast/ (PLAN.md §5.5).
on:
  push:
    branches: [main]
    paths: [viewer/**, shared/**, package-lock.json, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @abestar/viewer
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: viewer/dist
      - id: deployment
        uses: actions/deploy-pages@v5
